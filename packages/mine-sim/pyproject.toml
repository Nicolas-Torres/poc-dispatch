[project]
name = "mine-sim"
version = "0.1.0"
description = "Discrete-event digital twin of an open-pit mine driven by a dispatch policy"
requires-python = ">=3.12"
dependencies = [
    "dispatch-engine",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "simpy>=4.1",
]

[tool.uv.sources]
dispatch-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mine_sim"]
