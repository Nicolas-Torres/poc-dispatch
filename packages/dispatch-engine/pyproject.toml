[project]
name = "dispatch-engine"
version = "0.1.0"
description = "DISPATCH-style assignment engine: best path, production plan and real-time assignment"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.4",
    "ortools>=9.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch_engine"]
