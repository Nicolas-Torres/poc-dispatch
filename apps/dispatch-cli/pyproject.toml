[project]
name = "dispatch-cli"
version = "0.1.0"
description = "Command line entry point to run mine dispatch scenarios"
requires-python = ">=3.12"
dependencies = [
    "mine-sim",
    "typer>=0.15",
]

[project.scripts]
dispatch-cli = "dispatch_cli.main:app"

[tool.uv.sources]
mine-sim = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch_cli"]
